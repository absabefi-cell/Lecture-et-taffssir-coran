name: APK Coran

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les outils Android
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Erreur : sdkmanager introuvable."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Installer Cordova
        run: npm install -g cordova@12.0.0

      - name: Creer application Coran
        shell: bash
        run: |
          set -euo pipefail

          cordova create coran com.absabefi.coran "Coran Tafsir"
          cd coran

          cat > config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <widget
            id="com.absabefi.coran"
            version="1.0.0"
            xmlns="http://www.w3.org/ns/widgets"
            xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Coran Tafsir</name>
            <description>Lecture et tafsir du Coran</description>
            <author>Absabefi</author>
           <icon src="../iconecoran.png" />
            <content src="https://absabefi-cell.github.io/Lecture-et-taffssir-coran/" />
            <access origin="https://*" />
            <allow-navigation href="https://absabefi-cell.github.io/*" />
            <allow-intent href="https://*/*" />
            <preference name="DisallowOverscroll" value="true" />
            <preference name="MediaPlaybackRequiresUserAction" value="false" />
            <preference name="android-targetSdkVersion" value="35" />
            <preference name="android-buildToolsVersion" value="35.0.0" />
          </widget>
          XML

          cordova platform add android@14.0.0

      - name: Construire APK
        working-directory: coran
        run: cordova build android --debug

      - name: Rendre APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: APK-Coran
          path: coran/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
