name: APK Coran

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Recuperer les fichiers du depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Installer les outils Android
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Outil sdkmanager introuvable."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Installer Cordova et le traitement des images
        shell: bash
        run: |
          set -euo pipefail
          npm install -g cordova@12
          python3 -m venv "$RUNNER_TEMP/icon-tools"
          "$RUNNER_TEMP/icon-tools/bin/pip" install Pillow

      - name: Trouver la nouvelle icone
        shell: bash
        run: |
          set -euo pipefail

          ICON_PATH="$(find "$GITHUB_WORKSPACE" \
            -type f -iname 'iconecoran.png' \
            -not -path '*/.git/*' \
            -print -quit)"

          if [ -z "$ICON_PATH" ]; then
            echo "::error::Image iconecoran.png introuvable. Ajoute cette image au depot GitHub."
            exit 1
          fi

          cp "$ICON_PATH" "$RUNNER_TEMP/iconecoran-source.png"
          echo "Icone trouvee : $ICON_PATH"

      - name: Creer le projet Coran
        shell: bash
        run: |
          set -euo pipefail

          cordova create \
            "$RUNNER_TEMP/coran-app" \
            com.absabefi.coran \
            "Coran"

      - name: Generer les icones et la configuration
        shell: bash
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/icon-tools/bin/python" <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageOps

          temp = Path(os.environ["RUNNER_TEMP"])
          app = temp / "coran-app"
          icons = app / "res" / "icon" / "android"
          icons.mkdir(parents=True, exist_ok=True)

          source = Image.open(
              temp / "iconecoran-source.png"
          ).convert("RGBA")

          densities = {
              "ldpi": 36,
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          tags = []

          for density, size in densities.items():
              fitted = ImageOps.contain(
                  source,
                  (size, size),
                  Image.Resampling.LANCZOS,
              )
              canvas = Image.new(
                  "RGBA", (size, size), "white"
              )
              position = (
                  (size - fitted.width) // 2,
                  (size - fitted.height) // 2,
              )
              canvas.alpha_composite(fitted, position)
              canvas.convert("RGB").save(
                  icons / f"{density}.png"
              )
              tags.append(
                  f'<icon density="{density}" '
                  f'src="res/icon/android/{density}.png" />'
              )

          icon_tags = "\n".join(tags)

          config = f'''<?xml version="1.0" encoding="utf-8"?>
          <widget
              id="com.absabefi.coran"
              version="1.0.0"
              xmlns="http://www.w3.org/ns/widgets"
              xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Coran</name>
            <description>Lecture et tafsir du Coran</description>
            <author>Absabefi</author>

            <content src="https://absabefi-cell.github.io/Lecture-et-taffssir-coran/" />

            <access origin="*" />
            <allow-navigation href="https://absabefi-cell.github.io/*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />

            <preference name="AndroidWindowSplashScreenBackground" value="#FFFFFF" />
            <preference name="MediaPlaybackRequiresUserAction" value="false" />

            <platform name="android">
              <preference name="android-minSdkVersion" value="24" />
              <preference name="android-targetSdkVersion" value="35" />
              <preference name="android-compileSdkVersion" value="35" />
              {icon_tags}
            </platform>
          </widget>
          '''

          (app / "config.xml").write_text(
              config, encoding="utf-8"
          )
          PY

      - name: Ajouter Android
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/coran-app"
          cordova platform add android@14.0.1

      - name: Construire le nouvel APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/coran-app"
          cordova build android --debug

      - name: Verifier et recuperer APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$RUNNER_TEMP/coran-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK absent ou vide."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-final"
          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/apk-final/Coran.apk"

          unzip -t "$GITHUB_WORKSPACE/apk-final/Coran.apk"

      - name: Mettre APK en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: Coran-APK
          path: apk-final/Coran.apk
          if-no-files-found: error
          retention-days: 30
