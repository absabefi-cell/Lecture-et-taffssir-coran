name: APK Coran

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Recuperer les fichiers du depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les outils Android
        uses: android-actions/setup-android@v3

      - name: Installer Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Installer Cordova
        shell: bash
        run: |
          set -euo pipefail
          npm install -g cordova@12

      - name: Preparer les fichiers
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import os

          root = Path(os.environ["GITHUB_WORKSPACE"])
          destination = Path(os.environ["RUNNER_TEMP"]) / "coran-source"

          if destination.exists():
              shutil.rmtree(destination)

          ignored = {".git", ".github", "node_modules", "platforms", "plugins"}

          def ignore(directory, names):
              return [name for name in names if name in ignored]

          shutil.copytree(root, destination, ignore=ignore)

          html_files = sorted(
              destination.rglob("*"),
              key=lambda p: str(p).lower()
          )

          html_files = [
              p for p in html_files
              if p.is_file() and p.suffix.lower() in {".html", ".htm"}
          ]

          if not html_files:
              raise SystemExit(
                  "ERREUR : aucun fichier HTML trouve dans le depot."
              )

          preferred = [
              p for p in html_files
              if p.name.lower() == "index.html"
          ]

          coran_files = [
              p for p in html_files
              if "coran" in p.name.lower()
          ]

          if preferred:
              selected = preferred[0]
          elif len(coran_files) == 1:
              selected = coran_files[0]
          elif len(html_files) == 1:
              selected = html_files[0]
          else:
              names = "\n".join(
                  str(p.relative_to(destination)) for p in html_files
              )
              raise SystemExit(
                  "Plusieurs fichiers HTML trouves. "
                  "Renomme le fichier principal en index.html :\n" + names
              )

          relative = selected.relative_to(destination)

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CORAN_ENTRY={relative.as_posix()}\n")

          print(f"Fichier principal : {relative}")
          PY

      - name: Creer application Coran
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$RUNNER_TEMP/coran-app"

          cordova create "$APP_DIR" com.coranaudio.app "Coran"

          rm -rf "$APP_DIR/www"
          mkdir -p "$APP_DIR/www"
          cp -a "$RUNNER_TEMP/coran-source/." "$APP_DIR/www/"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil
          import xml.etree.ElementTree as ET

          app = Path(os.environ["RUNNER_TEMP"]) / "coran-app"
          www = app / "www"

          namespace = "http://www.w3.org/ns/widgets"
          ET.register_namespace("", namespace)
          ET.register_namespace(
              "cdv", "http://cordova.apache.org/ns/1.0"
          )

          config = app / "config.xml"
          tree = ET.parse(config)
          root = tree.getroot()

          content = root.find(f"{{{namespace}}}content")
          content.set("src", os.environ["CORAN_ENTRY"])

          icons = sorted(
              p for p in www.rglob("*")
              if p.is_file()
              and p.stem.lower() == "iconecoran"
              and p.suffix.lower() == ".png"
          )

          if icons:
              resources = app / "res"
              resources.mkdir(exist_ok=True)
              shutil.copy2(icons[0], resources / "iconecoran.png")

              ET.SubElement(
                  root,
                  f"{{{namespace}}}icon",
                  {"src": "res/iconecoran.png"}
              )
              print(f"Icone utilisee : {icons[0].name}")
          else:
              print(
                  "Aucune image iconecoran.png trouvee : "
                  "utilisation de l'icone par defaut."
              )

          tree.write(config, encoding="utf-8", xml_declaration=True)
          PY

          cd "$APP_DIR"
          cordova platform add android@14.0.0

      - name: Construire APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/coran-app"
          cordova build android --debug

      - name: Verifier APK
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-final"
          mkdir -p "$OUTPUT_DIR"

          APK_PATH="$RUNNER_TEMP/coran-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "ERREUR : APK absent ou vide."
            exit 1
          fi

          cp "$APK_PATH" "$OUTPUT_DIR/Coran.apk"

          test -s "$OUTPUT_DIR/Coran.apk"
          ls -lh "$OUTPUT_DIR/Coran.apk"

      - name: Telecharger APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Coran
          path: apk-final/Coran.apk
          if-no-files-found: error
          retention-days: 14
